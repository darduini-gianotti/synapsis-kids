<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panquecca em 1:1 - Vídeo Oficial Synapsis Kids</title>
<style>
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #090d16;
    color: #f8fafc;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    text-align: center;
    max-width: 600px;
    margin-bottom: 24px;
  }
  .header h1 {
    color: #38bdf8;
    font-size: 28px;
    margin-bottom: 6px;
  }
  .header p {
    color: #94a3b8;
    font-size: 15px;
    margin: 0;
  }
  .player-card {
    background: #1e293b;
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 2px solid #38bdf8;
    max-width: 480px;
    width: 100%;
  }
  video {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    background: #0f172a;
    object-fit: cover;
  }
  .badges-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .badge {
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
  }
  .badge-ratio { background: #0284c7; color: white; }
  .badge-size { background: #10b981; color: white; }
  .badge-res { background: #8b5cf6; color: white; }
</style>
</head>
<body>

<div class="header">
  <h1>🐾 Panquecca Oficial (Formato 1:1)</h1>
  <p>Enquadramento perfeito sem barras pretas laterais, pronto para o app!</p>
</div>

<div class="player-card">
  <video src="panquecca_1x1.mp4" controls autoplay loop playsinline></video>
  <div class="badges-row">
    <span class="badge badge-ratio">Proporção: 1:1 (Quadrado)</span>
    <span class="badge badge-res">768 x 768 px</span>
    <span class="badge badge-size">Apenas 547 KB!</span>
  </div>
</div>

</body>
</html>
